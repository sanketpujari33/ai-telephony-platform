apiVersion: v1
kind: Service
metadata:
  name: {{ include "transfer-manager.fullname" . }}
  labels:
    {{- include "transfer-manager.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.istio.sidecar.enabled }}
    sidecar.istio.io/inject: "true"
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grpc
      protocol: TCP
      port: {{ .Values.service.ports.grpc }}
      targetPort: grpc

  selector:
    {{- include "transfer-manager.selectorLabels" . | nindent 4 }}
# Default values for media-proxy
replicaCount: 3

image:
  repository: ai-telephony-platform/media-proxy
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9091"
  prometheus.io/path: "/metrics"
  sidecar.istio.io/inject: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  ports:
    grpc: 9091
    metrics: 9091
    rtp-start: 10000
    rtp-end: 20000

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 30
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - media-proxy
          topologyKey: kubernetes.io/hostname

config:
  platform:
    media:
      proxy:
        grpc:
          listen: "0.0.0.0:9091"
          max_recv_msg_size: 16777216
          max_send_msg_size: 16777216
        mediasoup:
          num_workers: 4
          worker_settings:
            rtc_min_port: 40000
            rtc_max_port: 49999
            dtls_certificate_file: "/etc/mediasoup/certs/dtls.crt"
            dtls_private_key_file: "/etc/mediasoup/certs/dtls.key"
        rtp_port_range:
          start: 10000
          end: 20000
        codecs:
          - name: "opus"
            payload_type: 111
            clock_rate: 48000
            channels: 2
            parameters:
              useinbandfec: 1
              usedtx: 1
          - name: "PCMU"
            payload_type: 0
            clock_rate: 8000
            channels: 1
          - name: "PCMA"
            payload_type: 8
            clock_rate: 8000
            channels: 1
          - name: "G722"
            payload_type: 9
            clock_rate: 16000
            channels: 1
        jitter_buffer:
          enabled: true
          min_delay: 20
          max_delay: 200
          target_delay: 60
          adaptive: true
        plc:
          enabled: true
          algorithm: "default"
        dtmf:
          rfc4733_enabled: true
          inband_enabled: true
          sip_info_enabled: true
        quality_metrics:
          enabled: true
          interval: 5
          emit_to_prometheus: true
      transcoder:
        enabled: true
        image: "ffmpeg:latest"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"

secrets: {}

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

livenessProbe:
  httpGet:
    path: /health
    port: 9091
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 9091
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: 9091
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 50%

networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: call-router
      ports:
        - protocol: TCP
          port: 9091
    - from:
        - podSelector:
            matchLabels:
              app: orchestrator
      ports:
        - protocol: TCP
          port: 9091
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9091

istio:
  sidecar:
    enabled: true
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
  virtualService:
    enabled: true
    hosts:
      - media-proxy
    gateways:
      - istio-system/internal-gateway
  destinationRule:
    enabled: true
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 1000
        http:
          h2UpgradePolicy: UPGRADE
          http1MaxPendingRequests: 1000
          http2MaxRequests: 1000
      loadBalancer:
        simple: LEAST_REQUEST
      outlierDetection:
        consecutive5xxErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
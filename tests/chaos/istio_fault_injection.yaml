apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: stt-provider-chaos
  namespace: ai-telephony
spec:
  hosts:
  - api.deepgram.com # Target STT provider
  http:
  - fault:
      delay:
        percentage:
          value: 30.0 # Inject a 5s delay into 30% of requests
        fixedDelay: 5s
    route:
    - destination:
        host: api.deepgram.com

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: llm-provider-chaos
  namespace: ai-telephony
spec:
  hosts:
  - api.openai.com # Target LLM provider
  http:
  - fault:
      abort:
        percentage:
          value: 15.0 # Inject HTTP 503 errors into 15% of requests
        httpStatus: 503
    route:
    - destination:
        host: api.openai.com

